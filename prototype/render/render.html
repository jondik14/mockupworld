<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// Phone dimensions (mm). Screen aspect matches the 393x852 UI renders.
const BODY_W = 71.2, BODY_H = 149.4, DEPTH = 7.9, BEVEL = 1.5, BODY_R = 11;
const SCREEN_W = 67.0, SCREEN_H = SCREEN_W * 852 / 393, SCREEN_R = 9.2;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function planeFromShape(shape, w, h) {
  const g = new THREE.ShapeGeometry(shape, 32);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);
  return g;
}

const texCache = {};
const loader = new THREE.TextureLoader();
function screenTex(name) {
  if (!texCache[name]) {
    texCache[name] = new Promise((res) => loader.load(`screens/${name}.png`, (t) => {
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t);
    }));
  }
  return texCache[name];
}

async function makePhone({ color, screen, back = false, finish = "clay" }) {
  const g = new THREE.Group();
  const inner = BODY_W - 2 * BEVEL, innerH = BODY_H - 2 * BEVEL;
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRect(inner, innerH, BODY_R - BEVEL), {
    depth: DEPTH - 2 * BEVEL, bevelEnabled: true, bevelThickness: BEVEL, bevelSize: BEVEL,
    bevelSegments: 8, curveSegments: 32,
  });
  bodyGeo.translate(0, 0, -(DEPTH - 2 * BEVEL) / 2);
  const clay = new THREE.MeshStandardMaterial({
    color, roughness: finish === "gloss" ? 0.35 : 0.82, metalness: 0, envMapIntensity: 0.9,
  });
  const body = new THREE.Mesh(bodyGeo, clay);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const front = DEPTH / 2;
  const glass = new THREE.Mesh(
    planeFromShape(roundedRect(BODY_W - 3.2, BODY_H - 3.2, BODY_R - 1.6), BODY_W - 3.2, BODY_H - 3.2),
    new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.18, metalness: 0, envMapIntensity: 1.2 }),
  );
  glass.position.z = front + 0.02;
  g.add(glass);

  let screenMesh = null;
  if (screen) {
    const tex = await screenTex(screen);
    screenMesh = new THREE.Mesh(
      planeFromShape(roundedRect(SCREEN_W, SCREEN_H, SCREEN_R), SCREEN_W, SCREEN_H),
      new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }),
    );
    screenMesh.position.z = front + 0.06;
    g.add(screenMesh);
    // faint glass sheen over the screen
    const sheen = new THREE.Mesh(
      planeFromShape(roundedRect(SCREEN_W, SCREEN_H, SCREEN_R), SCREEN_W, SCREEN_H),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.06, envMapIntensity: 2 }),
    );
    sheen.position.z = front + 0.09;
    sheen.userData.sheen = true;
    g.add(sheen);
  }

  if (back) {
    const bump = new THREE.Mesh(
      new THREE.ExtrudeGeometry(roundedRect(34, 34, 8), { depth: 0.6, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.5, bevelSegments: 4, curveSegments: 24 }),
      clay,
    );
    bump.rotation.y = Math.PI;
    bump.position.set(BODY_W / 2 - 4.5 - 17, BODY_H / 2 - 4.5 - 17, -front - 0.1);
    bump.castShadow = true;
    g.add(bump);
    const lensMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.12, envMapIntensity: 1.5 });
    const ringMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
    for (const [lx, ly] of [[-7.8, 7.8], [-7.8, -7.8], [8.2, 0]]) {
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.4, 2.2, 48), ringMat);
      ring.rotation.x = Math.PI / 2;
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 2.4, 48), lensMat);
      lens.rotation.x = Math.PI / 2;
      const px = BODY_W / 2 - 4.5 - 17 - lx, py = BODY_H / 2 - 4.5 - 17 + ly;
      ring.position.set(px, py, -front - 2.0);
      lens.position.set(px, py, -front - 2.1);
      ring.castShadow = true;
      g.add(ring, lens);
    }
  }
  return { group: g, screenMesh };
}

function deg(d) { return (d * Math.PI) / 180; }

window.renderScene = async function (cfg) {
  const { width, height, bg, wall = false, phones, cam, light = {} } = cfg;
  renderer.setSize(width, height);
  const scene = new THREE.Scene();
  const bgColor = new THREE.Color(bg);
  scene.background = bgColor;
  scene.environment = envTex;
  scene.environmentIntensity = light.env ?? 0.55;
  scene.fog = new THREE.Fog(bgColor, cam.distance * 1.6, cam.distance * 4);

  const groundMat = new THREE.MeshStandardMaterial({ color: bg, roughness: 1, metalness: 0, envMapIntensity: 0.4 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  if (wall) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
    w.position.z = wall.z ?? -60;
    w.receiveShadow = true;
    scene.add(w);
  }

  scene.add(new THREE.HemisphereLight(0xffffff, bgColor, light.hemi ?? 0.55));
  const key = new THREE.DirectionalLight(0xffffff, light.key ?? 2.3);
  const kd = light.dir ?? [-0.55, 1, 0.45];
  key.position.set(kd[0] * 400, kd[1] * 400, kd[2] * 400);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = light.soft ?? 14;
  key.shadow.blurSamples = 24;
  key.shadow.bias = -0.0004;
  const sc = key.shadow.camera;
  sc.left = sc.bottom = -220; sc.right = sc.top = 220; sc.near = 10; sc.far = 1200;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, light.fill ?? 0.5);
  fill.position.set(300, 150, 300);
  scene.add(fill);

  let primary = null;
  for (const p of phones) {
    const { group, screenMesh } = await makePhone(p);
    group.position.set(...(p.pos ?? [0, 0, 0]));
    group.rotation.set(deg(p.rot?.[0] ?? 0), deg(p.rot?.[1] ?? 0), deg(p.rot?.[2] ?? 0), p.order ?? "XYZ");
    scene.add(group);
    if (p.primary && screenMesh) primary = screenMesh;
  }
  if (!primary) {
    // default: first phone with a screen
    scene.traverse((o) => { if (!primary && o.isMesh && o.material.isMeshBasicMaterial && o.material.map) primary = o; });
  }

  const camera = new THREE.PerspectiveCamera(cam.fov ?? 28, width / height, 1, 5000);
  const el = deg(cam.elevation), az = deg(cam.azimuth ?? 0);
  const t = new THREE.Vector3(...(cam.target ?? [0, 0, 0]));
  camera.position.set(
    t.x + cam.distance * Math.cos(el) * Math.sin(az),
    t.y + cam.distance * Math.sin(el),
    t.z + cam.distance * Math.cos(el) * Math.cos(az),
  );
  if (cam.up) camera.up.set(...cam.up);
  camera.lookAt(t);
  if (cam.roll) camera.rotateZ(deg(cam.roll));
  camera.updateMatrixWorld();

  renderer.render(scene, camera);
  const image = renderer.domElement.toDataURL("image/png");

  // Screen quad (TL, TR, BR, BL of the UI image) in output pixel space.
  scene.updateMatrixWorld(true);
  const corners = [[-SCREEN_W / 2, SCREEN_H / 2], [SCREEN_W / 2, SCREEN_H / 2], [SCREEN_W / 2, -SCREEN_H / 2], [-SCREEN_W / 2, -SCREEN_H / 2]];
  const quad = corners.map(([x, y]) => {
    const v = new THREE.Vector3(x, y, 0).applyMatrix4(primary.matrixWorld).project(camera);
    return [+(((v.x + 1) / 2) * width).toFixed(2), +(((1 - v.y) / 2) * height).toFixed(2)];
  });

  // Mask pass: primary screen white, everything else black (keeps occlusion + rounded corners).
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
  const saved = [];
  scene.traverse((o) => {
    if (o.isMesh) {
      saved.push([o, o.material, o.visible]);
      if (o.userData.sheen) o.visible = false;
      o.material = o === primary ? white : black;
    }
  });
  scene.background = new THREE.Color(0x000000);
  scene.fog = null;
  const tm = renderer.toneMapping;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.render(scene, camera);
  const mask = renderer.domElement.toDataURL("image/png");
  renderer.toneMapping = tm;
  for (const [o, m, v] of saved) { o.material = m; o.visible = v; }

  return { image, mask, quad };
};
window.ready = true;
</script></body></html>
