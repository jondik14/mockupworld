<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function planeFromShape(shape, w, h) {
  const g = new THREE.ShapeGeometry(shape, 32);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);
  return g;
}

function deg(d) { return (d * Math.PI) / 180; }

const texCache = {};
const loader = new THREE.TextureLoader();
function screenTex(name) {
  if (!texCache[name]) {
    texCache[name] = new Promise((res) => loader.load(`screens/${name}.png`, (t) => {
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t);
    }));
  }
  return texCache[name];
}

function screenMeshFor(w, h, r, tex, zFront) {
  const mesh = new THREE.Mesh(
    planeFromShape(roundedRect(w, h, r), w, h),
    new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, side: THREE.DoubleSide }),
  );
  mesh.position.z = zFront;
  const sheen = new THREE.Mesh(
    planeFromShape(roundedRect(w, h, r), w, h),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.06, envMapIntensity: 2, side: THREE.DoubleSide }),
  );
  sheen.position.z = zFront + 0.03;
  sheen.userData.sheen = true;
  return { mesh, sheen };
}

// ---- iPhone (17 Pro proportions: flatter single camera plateau) ----
const PHONE_W = 71.2, PHONE_H = 149.4, PHONE_DEPTH = 8.2, PHONE_BEVEL = 1.5, PHONE_R = 12;
const PHONE_SCREEN = { w: 67.0, h: 67.0 * 852 / 393, r: 9.6 };

async function makePhone({ color, screen, back = false, finish = "clay" }) {
  const g = new THREE.Group();
  const inner = PHONE_W - 2 * PHONE_BEVEL, innerH = PHONE_H - 2 * PHONE_BEVEL;
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRect(inner, innerH, PHONE_R - PHONE_BEVEL), {
    depth: PHONE_DEPTH - 2 * PHONE_BEVEL, bevelEnabled: true, bevelThickness: PHONE_BEVEL, bevelSize: PHONE_BEVEL,
    bevelSegments: 8, curveSegments: 32,
  });
  bodyGeo.translate(0, 0, -(PHONE_DEPTH - 2 * PHONE_BEVEL) / 2);
  const clay = new THREE.MeshStandardMaterial({
    color, roughness: finish === "gloss" ? 0.35 : 0.82, metalness: finish === "titanium" ? 0.55 : 0, envMapIntensity: 0.9,
  });
  const body = new THREE.Mesh(bodyGeo, clay);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const front = PHONE_DEPTH / 2;
  const glass = new THREE.Mesh(
    planeFromShape(roundedRect(PHONE_W - 3.2, PHONE_H - 3.2, PHONE_R - 1.6), PHONE_W - 3.2, PHONE_H - 3.2),
    new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.18, metalness: 0, envMapIntensity: 1.2 }),
  );
  glass.position.z = front + 0.02;
  g.add(glass);

  let screenMesh = null;
  if (screen) {
    const tex = await screenTex(screen);
    const { w, h, r } = PHONE_SCREEN;
    const { mesh, sheen } = screenMeshFor(w, h, r, tex, front + 0.06);
    screenMesh = mesh;
    g.add(mesh, sheen);
  }

  if (back) {
    // 17 Pro-style plateau: one large rounded-square island holding all lenses + flash.
    const plateau = new THREE.Mesh(
      new THREE.ExtrudeGeometry(roundedRect(44, 33, 12), { depth: 0.9, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.5, bevelSegments: 4, curveSegments: 24 }),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.86), roughness: 0.55 }),
    );
    plateau.rotation.y = Math.PI;
    const px0 = 0, py0 = PHONE_H / 2 - 4.5 - 16.5;
    plateau.position.set(px0, py0, -front - 1.7); // body bevelThickness=PHONE_BEVEL(1.5) juts past `front`; clear it
    plateau.castShadow = true;
    g.add(plateau);
    const lensMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.1, envMapIntensity: 1.6 });
    const ringMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.95), roughness: 0.4, metalness: 0.3 });
    for (const [lx, ly] of [[-11, 7.5], [-11, -7.5], [10.5, 0]]) {
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(6.4, 6.6, 1.6, 48), ringMat);
      ring.rotation.x = Math.PI / 2;
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, 1.8, 48), lensMat);
      lens.rotation.x = Math.PI / 2;
      const px = px0 - lx, py = py0 + ly;
      ring.position.set(px, py, -front - 2.0);
      lens.position.set(px, py, -front - 2.1);
      ring.castShadow = true;
      g.add(ring, lens);
    }
  }
  return { group: g, screenMesh, screenSize: PHONE_SCREEN };
}

// ---- MacBook Pro (latest silhouette: thin lid, camera notch, big trackpad) ----
// Local frame matches world axes at rot=[0,0,0]: X=width, Y=up, Z=depth
// (Z>0 toward the default camera). Hinge sits at the origin; the base
// extends toward the camera (Z: 0..MB_D), the lid's reference/flat pose
// extends away from it (Z: -MB_D..0) — i.e. lidAngle=180 is a tablet lying
// flat. Opening the lid rotates it about the hinge's X-axis; at lidAngle=90
// it stands vertical with its screen face pointing straight at +Z (camera).
const MB_W = 310, MB_D = 216, MB_T = 15, MB_R = 9;
const MB_LID_T = 6, MB_LID_R = 9, MB_BEZEL = 7.5;
const MB_SCREEN = { w: MB_W - 2 * MB_BEZEL, h: MB_D - MB_BEZEL - 11, r: 3 };

// A flat XY plate (from roundedRect) extruded along Z, re-oriented so the
// extrude axis (thickness) becomes +Y and the shape's own height becomes Z.
function slab(w, h, r, depth, bevel) {
  const geo = new THREE.ExtrudeGeometry(roundedRect(w, h, r), {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 6, curveSegments: 24,
  });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

async function makeMacBook({ color, screen, lidAngle = 108, finish = "metal" }) {
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color, roughness: 0.38, metalness: finish === "metal" ? 0.65 : 0.1, envMapIntensity: 1.1 });

  const baseGeo = slab(MB_W, MB_D, MB_R, MB_T, 1);
  baseGeo.translate(0, 0, MB_D / 2); // hinge at z=0, base extends to z=+MB_D (toward camera)
  const base = new THREE.Mesh(baseGeo, metal);
  base.castShadow = base.receiveShadow = true;
  g.add(base);

  // keyboard deck (subtle recessed rectangle) + trackpad (glossy), on the base's top face
  const deck = new THREE.Mesh(
    planeFromShape(roundedRect(MB_W - 24, MB_D - 40, 6), MB_W - 24, MB_D - 40),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.55), roughness: 0.7, side: THREE.DoubleSide }),
  );
  deck.rotation.x = -Math.PI / 2;
  deck.position.set(0, MB_T + 1.15, MB_D / 2 + 6); // base bevelThickness=1 juts past MB_T; clear it
  g.add(deck);
  const trackpad = new THREE.Mesh(
    planeFromShape(roundedRect(118, 74, 5), 118, 74),
    new THREE.MeshPhysicalMaterial({ color: new THREE.Color(color).multiplyScalar(0.8), roughness: 0.25, clearcoat: 0.6, side: THREE.DoubleSide }),
  );
  trackpad.rotation.x = -Math.PI / 2;
  trackpad.position.set(0, MB_T + 1.2, MB_D - 46);
  g.add(trackpad);

  // lid: built in its flat (lidAngle=180) reference pose spanning z:[-MB_D,0],
  // then tilted about the hinge — which sits atop the base (y=MB_T), not at
  // ground level, so the lid group is offset up before rotating.
  const lid = new THREE.Group();
  lid.position.set(0, MB_T, 0);
  const lidGeo = slab(MB_W, MB_D, MB_LID_R, MB_LID_T, 0.8);
  lidGeo.translate(0, 0, -MB_D / 2);
  const lidShell = new THREE.Mesh(lidGeo, metal);
  lidShell.castShadow = lidShell.receiveShadow = true;
  lid.add(lidShell);

  const bezel = new THREE.Mesh(
    planeFromShape(roundedRect(MB_W - 2, MB_D - 2, MB_LID_R - 1), MB_W - 2, MB_D - 2),
    new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.3, side: THREE.DoubleSide }),
  );
  bezel.rotation.x = -Math.PI / 2;
  bezel.position.set(0, MB_LID_T + 1.0, -MB_D / 2); // lid bevelThickness=0.8 juts past MB_LID_T; clear it
  lid.add(bezel);
  // camera notch, near the lid's far edge (z close to -MB_D)
  const notch = new THREE.Mesh(
    planeFromShape(roundedRect(16, 4.5, 2.2), 16, 4.5),
    new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.4, side: THREE.DoubleSide }),
  );
  notch.rotation.x = -Math.PI / 2;
  notch.position.set(0, MB_LID_T + 1.05, -MB_D + 5);
  lid.add(notch);

  let screenMesh = null;
  if (screen) {
    const tex = await screenTex(screen);
    const { w, h, r } = MB_SCREEN;
    const { mesh, sheen } = screenMeshFor(w, h, r, tex, MB_LID_T + 1.1);
    mesh.rotation.x = sheen.rotation.x = -Math.PI / 2;
    mesh.position.set(0, MB_LID_T + 1.1, -MB_D / 2);
    sheen.position.set(0, MB_LID_T + 1.15, -MB_D / 2);
    screenMesh = mesh;
    lid.add(mesh, sheen);
  }

  lid.rotation.x = deg(180 - lidAngle);
  g.add(lid);

  return { group: g, screenMesh, screenSize: MB_SCREEN };
}

// ---- Apple Watch Ultra (squircle case, big flat sapphire, crown + button) ----
const W_W = 49, W_H = 53, W_T = 14.4, W_R = 15;
const W_SCREEN = { w: 37, h: 43.5, r: 9 };

async function makeWatch({ color, screen, finish = "titanium" }) {
  const g = new THREE.Group();
  const caseGeo = new THREE.ExtrudeGeometry(roundedRect(W_W, W_H, W_R), {
    depth: W_T, bevelEnabled: true, bevelThickness: 1.6, bevelSize: 1.6, bevelSegments: 10, curveSegments: 32,
  });
  caseGeo.translate(0, 0, -W_T / 2);
  const caseMat = new THREE.MeshStandardMaterial({ color, roughness: finish === "titanium" ? 0.5 : 0.3, metalness: 0.5, envMapIntensity: 1.1 });
  const body = new THREE.Mesh(caseGeo, caseMat);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const front = W_T / 2;
  const crystal = new THREE.Mesh(
    planeFromShape(roundedRect(W_W - 4, W_H - 4, W_R - 3), W_W - 4, W_H - 4),
    new THREE.MeshStandardMaterial({ color: 0x040404, roughness: 0.12, envMapIntensity: 1.4, side: THREE.DoubleSide }),
  );
  crystal.position.z = front + 1.8; // case bevelThickness=1.6 juts past `front`; clear it
  g.add(crystal);

  let screenMesh = null;
  if (screen) {
    const tex = await screenTex(screen);
    const { w, h, r } = W_SCREEN;
    const { mesh, sheen } = screenMeshFor(w, h, r, tex, front + 2.0);
    screenMesh = mesh;
    g.add(mesh, sheen);
  }

  // crown + function button on the right edge
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 3.2, 32), caseMat);
  crown.rotation.z = Math.PI / 2;
  crown.position.set(W_W / 2 + 1.2, 4, 0);
  crown.castShadow = true;
  g.add(crown);
  const button = new THREE.Mesh(new THREE.CapsuleGeometry(1.6, 5, 4, 16), caseMat);
  button.rotation.z = Math.PI / 2;
  button.position.set(W_W / 2 + 1, -8, 0);
  g.add(button);

  // short band stubs top/bottom (mostly for silhouette; bands are cropped in most compositions)
  const bandMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.85 });
  for (const s of [1, -1]) {
    const stub = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 6), bandMat);
    stub.position.set(0, s * (W_H / 2 + 6), -1);
    stub.castShadow = true;
    g.add(stub);
  }

  return { group: g, screenMesh, screenSize: W_SCREEN };
}

const MAKERS = { iphone: makePhone, macbook: makeMacBook, watch: makeWatch };

window.renderScene = async function (cfg) {
  const { width, height, bg, wall = false, devices, phones, cam, light = {} } = cfg;
  const list = devices ?? phones; // `phones` kept for back-compat with early scenes
  renderer.setSize(width, height);
  const scene = new THREE.Scene();
  const bgColor = new THREE.Color(bg);
  scene.background = bgColor;
  scene.environment = envTex;
  scene.environmentIntensity = light.env ?? 0.55;
  scene.fog = new THREE.Fog(bgColor, cam.distance * 1.6, cam.distance * 4);

  // groundColor lets a scene use a distinct ground tone from the backdrop
  // (e.g. a green "grass" ground under a lighter sky-toned wall/fog).
  const groundMat = new THREE.MeshStandardMaterial({ color: cfg.groundColor ?? bg, roughness: 1, metalness: 0, envMapIntensity: 0.4 });
  const wallMat = new THREE.MeshStandardMaterial({ color: bg, roughness: 1, metalness: 0, envMapIntensity: 0.4 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  if (wall) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), wallMat);
    w.position.z = wall.z ?? -60;
    w.receiveShadow = true;
    scene.add(w);
  }

  scene.add(new THREE.HemisphereLight(0xffffff, bgColor, light.hemi ?? 0.55));
  const key = new THREE.DirectionalLight(0xffffff, light.key ?? 2.3);
  const kd = light.dir ?? [-0.55, 1, 0.45];
  key.position.set(kd[0] * 400, kd[1] * 400, kd[2] * 400);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = light.soft ?? 14;
  key.shadow.blurSamples = 24;
  key.shadow.bias = -0.0004;
  const sc = key.shadow.camera;
  sc.left = sc.bottom = -220; sc.right = sc.top = 220; sc.near = 10; sc.far = 1200;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, light.fill ?? 0.5);
  fill.position.set(300, 150, 300);
  scene.add(fill);

  let primary = null, primaryScreenSize = null;
  for (const d of list) {
    const make = MAKERS[d.kind ?? "iphone"];
    const { group, screenMesh, screenSize } = await make(d);
    group.position.set(...(d.pos ?? [0, 0, 0]));
    group.rotation.set(deg(d.rot?.[0] ?? 0), deg(d.rot?.[1] ?? 0), deg(d.rot?.[2] ?? 0), d.order ?? "XYZ");
    scene.add(group);
    if (d.primary && screenMesh) { primary = screenMesh; primaryScreenSize = screenSize; }
  }
  if (!primary) {
    scene.traverse((o) => { if (!primary && o.isMesh && o.material.isMeshBasicMaterial && o.material.map) primary = o; });
  }

  const camera = new THREE.PerspectiveCamera(cam.fov ?? 28, width / height, 1, 5000);
  const el = deg(cam.elevation), az = deg(cam.azimuth ?? 0);
  const t = new THREE.Vector3(...(cam.target ?? [0, 0, 0]));
  camera.position.set(
    t.x + cam.distance * Math.cos(el) * Math.sin(az),
    t.y + cam.distance * Math.sin(el),
    t.z + cam.distance * Math.cos(el) * Math.cos(az),
  );
  if (cam.up) camera.up.set(...cam.up);
  camera.lookAt(t);
  if (cam.roll) camera.rotateZ(deg(cam.roll));
  camera.updateMatrixWorld();

  renderer.render(scene, camera);
  const image = renderer.domElement.toDataURL("image/png");

  // Screen quad (TL, TR, BR, BL of the UI image) in output pixel space.
  scene.updateMatrixWorld(true);
  const { w: sw, h: sh } = primaryScreenSize;
  const corners = [[-sw / 2, sh / 2], [sw / 2, sh / 2], [sw / 2, -sh / 2], [-sw / 2, -sh / 2]];
  const quad = corners.map(([x, y]) => {
    const v = new THREE.Vector3(x, y, 0).applyMatrix4(primary.matrixWorld).project(camera);
    return [+(((v.x + 1) / 2) * width).toFixed(2), +(((1 - v.y) / 2) * height).toFixed(2)];
  });

  // Mask pass: primary screen white, everything else black (keeps occlusion + rounded corners).
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
  const saved = [];
  scene.traverse((o) => {
    if (o.isMesh) {
      saved.push([o, o.material, o.visible]);
      if (o.userData.sheen) o.visible = false;
      o.material = o === primary ? white : black;
    }
  });
  scene.background = new THREE.Color(0x000000);
  scene.fog = null;
  const tm = renderer.toneMapping;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.render(scene, camera);
  const mask = renderer.domElement.toDataURL("image/png");
  renderer.toneMapping = tm;
  for (const [o, m, v] of saved) { o.material = m; o.visible = v; }

  return { image, mask, quad };
};
window.ready = true;
</script></body></html>
